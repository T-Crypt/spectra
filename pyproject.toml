[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra"
version = "0.1.0"
description = "Architecture-aware GPU performance diagnosis and optimization"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spectra = "adascope.cli:main"

[tool.setuptools.packages.find]
include = ["adascope*"]
