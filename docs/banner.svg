<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Spectra banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="0.55" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#0a1210"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.6" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <!-- left die block -->
  <g font-family="monospace">
    <rect x="48" y="48" width="200" height="224" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="72" y="76" width="152" height="86" rx="4" fill="#020617" stroke="#2dd4bf" stroke-width="1"/>
    <g fill="#1e293b">
      <rect x="84" y="88" width="24" height="14"/><rect x="112" y="88" width="24" height="14"/><rect x="140" y="88" width="24" height="14"/><rect x="168" y="88" width="24" height="14"/>
      <rect x="84" y="106" width="24" height="14"/><rect x="112" y="106" width="24" height="14"/><rect x="140" y="106" width="24" height="14"/><rect x="168" y="106" width="24" height="14"/>
      <rect x="84" y="124" width="24" height="14"/><rect x="112" y="124" width="24" height="14"/><rect x="140" y="124" width="24" height="14"/><rect x="168" y="124" width="24" height="14"/>
    </g>
    <text x="72" y="190" fill="#7dd3fc" font-size="13">sm_89</text>
    <text x="130" y="190" fill="#475569" font-size="13">ada</text>
    <text x="72" y="212" fill="#94a3b8" font-size="12">1008 GB/s roof</text>
    <text x="72" y="232" fill="#94a3b8" font-size="12">450 W limit</text>
    <text x="72" y="252" fill="#2dd4bf" font-size="12">measured</text>
  </g>
  <!-- center trace -->
  <g>
    <path d="M280 220 L420 218 L520 200 L640 170 L760 150 L880 138" fill="none" stroke="url(#trace)" stroke-width="2.5"/>
    <g fill="#0f172a" stroke="#475569">
      <circle cx="420" cy="218" r="4" fill="#2dd4bf"/>
      <circle cx="640" cy="170" r="4" fill="#f59e0b"/>
      <circle cx="880" cy="138" r="4" fill="#f43f5e"/>
    </g>
    <g font-family="monospace" font-size="11" fill="#64748b">
      <text x="300" y="250">power_draw_w</text>
      <text x="520" y="250">tokens_predicted_total</text>
      <text x="740" y="250">throttle.sw_power_cap</text>
    </g>
  </g>
  <!-- title -->
  <g font-family="sans-serif">
    <text x="48" y="300" fill="#e2e8f0" font-size="22" letter-spacing="6">SPECTRA</text>
  </g>
  <!-- right hypothesis card -->
  <g font-family="monospace">
    <rect x="920" y="48" width="232" height="224" rx="10" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <text x="940" y="78" fill="#e2e8f0" font-size="13">ranked hypothesis</text>
    <text x="940" y="104" fill="#f59e0b" font-size="12">1  sm89.power-cap-limit</text>
    <text x="940" y="124" fill="#64748b" font-size="11">   evidence: power_ratio</text>
    <text x="940" y="142" fill="#64748b" font-size="11">   confidence: measured</text>
    <text x="940" y="168" fill="#94a3b8" font-size="12">2  decode-near-roof</text>
    <text x="940" y="188" fill="#64748b" font-size="11">   confidence: derived</text>
    <text x="940" y="214" fill="#475569" font-size="11">unavailable never estimated</text>
    <text x="940" y="234" fill="#475569" font-size="11">render twice byte-identical</text>
  </g>
  <g font-family="sans-serif">
    <text x="280" y="88" fill="#f1f5f9" font-size="30">Architecture-aware GPU diagnosis.</text>
    <text x="280" y="116" fill="#94a3b8" font-size="15">Measure the workload. Name the bottleneck. Keep only what evidence proves.</text>
  </g>
</svg>
